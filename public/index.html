<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz Quest</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#ffd23f; --gold-d:#a87a1c; --cream:#f4f1de; --ink:#0b0f1a;
    --fire:#ff4d2e; --water:#1ea7ff; --leaf:#38c93f; --earth:#f0a93a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; image-rendering:pixelated;}
  body{margin:0; font-family:'VT323',monospace; font-size:22px; color:var(--cream);
       background:repeating-linear-gradient(0deg,#0b0f1a,#0b0f1a 38px,#0c1120 38px,#0c1120 40px),#0b0f1a;
       min-height:100vh; display:flex; flex-direction:column;}
  .pixel{font-family:'Press Start 2P',monospace;}
  .screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center;}
  h1{font-family:'Press Start 2P',monospace; font-size:17px; line-height:1.6; margin:0 0 10px; color:var(--gold); text-shadow:3px 3px 0 #000;}
  .sub{opacity:.9; margin-bottom:20px; font-size:22px;}
  input{font-family:'VT323',monospace; font-size:26px; padding:12px; width:100%; max-width:320px;
        text-align:center; margin-bottom:12px; border:4px solid var(--gold); background:#0e1730; color:var(--cream); outline:none;}
  button{font-family:'Press Start 2P',monospace; cursor:pointer; color:var(--ink);}
  .btn{background:var(--gold); font-size:15px; padding:16px; width:100%; max-width:320px; border:4px solid var(--ink); box-shadow:0 6px 0 var(--gold-d);}
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--gold-d);}
  .btn:disabled{opacity:.4;}
  .err{color:#ff8a8a; margin-top:8px; min-height:22px; font-size:20px;}
  .badge{padding:6px 14px; border:3px solid #000; font-family:'Press Start 2P',monospace; font-size:11px; display:inline-block; margin-bottom:12px; color:#000;}
  .langs{display:flex; gap:8px; width:100%; max-width:320px; margin-bottom:14px;}
  .lang{flex:1; padding:10px 4px; font-size:17px; border:3px solid var(--gold); background:#0e1730; color:var(--cream); cursor:pointer; text-align:center;}
  .lang.sel{background:var(--gold); color:#000; font-weight:bold;}
  .heroes{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:330px; margin-bottom:16px;}
  .hero{display:flex; align-items:center; justify-content:center; padding:5px; background:#15203b; border:3px solid #2b3a5e; cursor:pointer; aspect-ratio:1;}
  .hero:active{transform:scale(.94);}
  .hero.sel{background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 3px var(--ink);}
  .hero img{width:100%; height:100%; object-fit:contain; image-rendering:pixelated;}
  .full{position:fixed; inset:0; display:flex; flex-direction:column;}
  .hdr{padding:10px 14px; display:flex; justify-content:space-between; align-items:center; font-family:'Press Start 2P',monospace; font-size:11px; color:var(--gold); border-bottom:3px solid var(--gold);}
  .qphone{padding:14px; font-size:26px; line-height:1.2; text-align:center; background:#0e1730; border-bottom:4px solid var(--gold);}
  .answers{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:10px; padding:10px;}
  .ans{border:4px solid #000; box-shadow:5px 5px 0 rgba(0,0,0,.5); color:#fff;
       display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:8px;
       font-family:'VT323',monospace; font-size:23px; line-height:1.1; text-shadow:1px 1px 0 rgba(0,0,0,.6); transition:transform .08s;}
  .ans:active{transform:scale(.96);}
  .a0{background:var(--fire);} .a1{background:var(--water);} .a2{background:var(--leaf);} .a3{background:var(--earth);}
  .big{font-family:'Press Start 2P',monospace; font-size:18px; line-height:1.6; margin:12px 0; color:var(--gold); text-shadow:2px 2px 0 #000;}
  .hidden{display:none !important;}
  .result-emoji{font-size:74px;}
  .map{width:100%; max-width:380px; aspect-ratio:1900/985; border:4px solid var(--gold); box-shadow:0 0 0 4px var(--ink); background:#2b6ea0; line-height:0; margin-top:10px;}
  .map svg{display:block; width:100%; height:100%;}
  .bigmap{position:absolute; inset:0; background:#47aba9;}
  .resCard{position:absolute; top:max(10px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
           display:flex; align-items:center; gap:12px; z-index:5; max-width:94%;
           background:rgba(11,15,26,.9); border:3px solid var(--gold); box-shadow:4px 4px 0 rgba(0,0,0,.5);
           padding:8px 16px; text-align:left;}
  .resCard .result-emoji{font-size:38px; line-height:1;}
  .resCard .big{font-size:15px;}
  .resCard .sub{font-size:18px;}
  .maplabel{font-family:'Press Start 2P',monospace; font-size:10px; color:var(--gold); margin-top:14px;}
  #modBanner{padding:10px 12px; font-size:21px; text-align:center; font-weight:bold; line-height:1.25; border-bottom:4px solid #000;}
  #modBanner.good{background:#16402a; color:#9effc4;} #modBanner.bad{background:#3a1630; color:#ff9ad1;}
  .nextmod{margin-top:10px; padding:8px 12px; font-size:20px; border:3px solid var(--gold);}
  .nextmod.good{background:#16402a; color:#9effc4;} .nextmod.bad{background:#3a1630; color:#ff9ad1;}
  .coinbal{font-family:'Press Start 2P',monospace; font-size:18px; color:var(--gold); margin-bottom:10px;}
  .shopgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; width:100%; max-width:340px;}
  .pot{padding:8px 6px; border:3px solid var(--gold); background:#15203b; color:var(--cream); cursor:pointer; text-align:center; line-height:1.2;}
  .pot:active{transform:scale(.96);} .pot.dis{opacity:.4;}
  .pot .pi{font-size:26px;} .pot .pn{font-size:17px;} .pot .pp{font-size:15px; color:var(--gold);}
  .targetpick{display:flex; flex-direction:column; gap:6px; width:100%; max-width:340px; margin-top:10px;}
  .tgt{padding:8px; border:3px solid #ff5fa2; background:#2a1430; color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; gap:8px; justify-content:center;}
  .armed{margin-top:10px; padding:8px 12px; border:3px solid var(--gold); background:#16402a; color:#9effc4; font-size:19px;}
</style>
</head>
<body>

<div class="screen" id="join">
  <h1>QUIZ QUEST</h1>
  <div class="sub">Enter the game PIN<br>from the host screen</div>
  <input id="pinInput" inputmode="numeric" maxlength="4" placeholder="PIN">
  <input id="nameInput" maxlength="16" placeholder="Your name">
  <button class="btn" id="joinBtn">JOIN</button>
  <div class="err" id="err"></div>
</div>

<div class="screen hidden" id="pick">
  <h1>CHOOSE YOUR AVATAR</h1>
  <div class="heroes" id="heroes"></div>
  <button class="btn" id="confirmBtn" disabled>CONFIRM</button>
</div>

<div class="screen hidden" id="wait">
  <div id="waitHero" style="margin-bottom:10px;"></div>
  <div class="badge" id="myname" style="background:var(--gold)"></div>
  <h1>YOU'RE IN!</h1>
  <div class="sub">Waiting to start…</div>
  <div class="maplabel">THE QUEST MAP</div>
  <div class="map" id="mapWait"></div>
</div>

<div class="full hidden" id="answering">
  <div class="hdr"><span id="qInfo"></span><span id="timeLeft"></span></div>
  <div id="modBanner" class="hidden"></div>
  <div class="qphone" id="qPhone"></div>
  <div class="answers" id="answers"></div>
</div>

<div class="screen hidden" id="submitted">
  <div class="result-emoji">⏳</div>
  <div class="big">ANSWER LOCKED IN</div>
  <div class="sub">Waiting for others…</div>
</div>

<div class="screen hidden" id="announce">
  <div id="blockNote" class="hidden" style="margin-bottom:6px;">
    <div class="result-emoji" id="anIcon">⚡</div>
    <div class="big" id="anTitle"></div>
    <div class="sub" id="anDesc" style="max-width:340px;"></div>
  </div>
  <div class="shopwrap">
    <div class="coinbal" id="potHeader">⚗️ USE A POTION</div>
    <div class="shopgrid" id="shopGrid"></div>
    <div class="targetpick hidden" id="targetPick"></div>
    <div class="armed hidden" id="armedNote"></div>
  </div>
  <button class="btn" id="ackBtn" style="margin-top:14px;">READY!</button>
  <div class="sub hidden" id="anWait" style="margin-top:14px;">Waiting for the next question…</div>
</div>

<div class="full hidden" id="result">
  <div class="bigmap" id="mapResult"></div>
  <div class="resCard">
    <span class="result-emoji" id="rEmoji"></span>
    <div>
      <div class="big" id="rText" style="margin:0;"></div>
      <div class="sub" id="rDetail" style="margin:0;opacity:.85;"></div>
    </div>
  </div>
</div>

<div class="screen hidden" id="gover">
  <div id="goHero" style="margin-bottom:10px;"></div>
  <div class="big" id="goText"></div>
</div>

<script src="/mapdata.js"></script>
<script src="/board.js"></script>
<script>
const socket=io();
let PIN=null, MYHERO=null, MYID=null, timerInt=null;
let LAST_BOARD={players:[]}, lastOptions=null, myChoice=null;
let POTIONS=[], INVENTORY=[], myOthers=[], usedThisRound=false;
let prepTimer=null, phase='lobby';   // phase guards against lag/out-of-order events
function renderMaps(animate){ renderBoardAnimated('mapWait', LAST_BOARD.players, {layout:'phone'});
  renderBoardAnimated('mapResult', LAST_BOARD.players, {layout:'phone', animate:animate, fit:'contain'}); }

const params=new URLSearchParams(location.search);
if(params.get('pin')) document.getElementById('pinInput').value=params.get('pin');
const $=id=>document.getElementById(id);
function show(id){ ['join','pick','wait','answering','submitted','result','announce','gover'].forEach(x=>$(x).classList.add('hidden')); $(id).classList.remove('hidden'); }

$('joinBtn').onclick=()=>{ const pin=$('pinInput').value.trim(), name=$('nameInput').value.trim();
  if(pin.length<4){ $('err').textContent='Enter the 4-digit PIN'; return; }
  if(!name){ $('err').textContent='Enter your name'; return; }
  socket.emit('joinRoom',{pin,name}); };

socket.on('joinError', m=>{ $('err').textContent=m; });
socket.on('board', d=>{ LAST_BOARD={players:d.players}; renderMaps(!!d.animate); });

socket.on('joined', d=>{
  PIN=d.pin; MYID=d.id; $('myname').textContent=d.name;
  POTIONS=d.potions||[]; INVENTORY=d.inventory||[];
  if(typeof setMapSpecials==='function') setMapSpecials(d.specials||[]);
  const grid=$('heroes'); grid.innerHTML='';
  d.heroes.forEach(h=>{ const b=document.createElement('div'); b.className='hero';
    b.innerHTML=avatarSVG(h,56);
    b.onclick=()=>{ MYHERO=h; document.querySelectorAll('.hero').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); $('confirmBtn').disabled=false; }; grid.appendChild(b); });
  show('pick');
});

$('confirmBtn').onclick=()=>{ if(MYHERO) socket.emit('chooseHero',{pin:PIN,hero:MYHERO}); };
socket.on('heroConfirmed', d=>{ MYHERO=d.hero; $('waitHero').innerHTML=avatarSVG(d.hero,64); show('wait'); });

socket.on('answerNow', d=>{
  // a new question is authoritative: cancel any pending result/shop transition
  // and any stale timer so lag can never strand a player on the wrong screen.
  if(prepTimer){ clearTimeout(prepTimer); prepTimer=null; }
  stopTimer(); phase='question';
  show('answering'); $('qInfo').textContent='Q'+(d.index+1)+(d.cat?' · '+d.cat:''); $('qPhone').textContent=d.q;
  lastOptions=d.options; myChoice=null;
  const mb=$('modBanner'); const eff=d.effects||[];
  if(eff.length){ const bad=eff.some(e=>!e.good); mb.className=bad?'bad':'good';
    mb.innerHTML=eff.map(e=>e.icon+' '+e.label+' — '+e.desc).join('<br>'); }
  else { mb.className='hidden'; mb.innerHTML=''; }
  const hide=d.hide||[];
  const grid=$('answers'); grid.innerHTML='';
  d.options.forEach((o,i)=>{ if(hide.indexOf(i)>=0) return;   // 50/50 removed option
    const b=document.createElement('button'); b.className='ans a'+i;
    b.innerHTML='<span>'+iconSVG(ELEMS[i],36)+'</span><span>'+o+'</span>';
    b.onclick=()=>{ myChoice=i; socket.emit('submitAnswer',{pin:PIN,choice:i}); }; grid.appendChild(b); });
  startTimer(d.time);
});

socket.on('answerReceived', ()=>{ if(phase!=='question') return; stopTimer(); show('submitted'); });

socket.on('yourResult', d=>{
  if(prepTimer){ clearTimeout(prepTimer); prepTimer=null; }
  stopTimer(); phase='result'; show('result');
  const plen=d.pathLength||60;
  const correctText = (lastOptions && d.correctIndex!=null) ? lastOptions[d.correctIndex] : '';
  const answerLine = correctText ? ('Correct answer: '+correctText) : '';
  if(d.finishRank){
    const medals=['🥇','🥈','🥉'];
    $('rEmoji').textContent=medals[d.finishRank-1]||'🏰';
    $('rText').textContent='YOU FINISHED #'+d.finishRank+'!';
    $('rDetail').innerHTML=(d.moved?'You reached the castle!':'Enjoy the view from the castle…')
      + (answerLine?'<br>'+answerLine:'');
  } else if(d.correct){
    $('rEmoji').textContent='✅';
    $('rText').textContent='CORRECT! +'+d.moved;
    $('rDetail').innerHTML='Tile '+d.after+' / '+plen + (answerLine?'<br>'+answerLine:'');
  } else if(d.usedModifier && d.usedModifier.type==='trap' && d.moved<0){
    $('rEmoji').textContent='🧙'; $('rText').textContent='TRAPPED! '+d.moved;
    $('rDetail').innerHTML='The wizard sent you back!<br>'+(answerLine||'')+'<br>Now on tile '+d.after+' / '+plen;
  } else {
    $('rEmoji').textContent='❌'; $('rText').textContent='WRONG';
    $('rDetail').innerHTML=(answerLine||'No move')+'<br>Still on tile '+d.after+' / '+plen;
  }
  // after showing the result, open the potion screen — but ONLY if the player
  // still owns potions and is still racing. If they have none left, we skip the
  // screen entirely and just follow the game (nothing to get stuck on).
  myOthers = d.others||[];
  if(Array.isArray(d.inventory)) INVENTORY=d.inventory;
  usedThisRound=false;
  const nm=d.nextModifier;
  const showShop = INVENTORY.length>0 && !d.finishRank;
  prepTimer=setTimeout(()=>{
    prepTimer=null;
    if(phase!=='result') return;        // a new question already arrived — do nothing
    if(!showShop) return;               // no potions: just stay on the map and follow the game
    const bn=$('blockNote');
    if(nm){ bn.classList.remove('hidden');
      $('anIcon').textContent=nm.icon; $('anTitle').textContent=nm.label+'!';
      $('anTitle').style.color = nm.good ? '#9effc4' : '#ff9ad1'; $('anDesc').textContent=nm.desc;
    } else bn.classList.add('hidden');
    $('ackBtn').classList.remove('hidden'); $('anWait').classList.add('hidden');
    $('targetPick').classList.add('hidden'); $('armedNote').classList.add('hidden');
    renderShop();
    show('announce');
  }, d.reachedGoal?3000:2000);
});
$('ackBtn').onclick=()=>{ $('ackBtn').classList.add('hidden'); $('anWait').classList.remove('hidden'); $('shopGrid').innerHTML=''; $('targetPick').classList.add('hidden'); };

function renderShop(){
  $('potHeader').innerHTML='⚗️ USE A POTION <span style="color:#9effc4;font-size:13px;">('+INVENTORY.length+' left · one per round)</span>';
  const g=$('shopGrid'); g.innerHTML='';
  if(INVENTORY.length<=0){ g.innerHTML='<div class="sub" style="grid-column:1/3;">No potions left.</div>'; return; }
  // show only the potions the player still owns
  POTIONS.filter(p=>INVENTORY.indexOf(p.key)>=0).forEach(p=>{
    const usable = !usedThisRound;
    const b=document.createElement('div'); b.className='pot'+(usable?'':' dis');
    b.innerHTML='<div class="pi">'+p.icon+'</div><div class="pn">'+p.name+'</div><div class="pp" style="font-size:13px;">'+p.desc+'</div>';
    b.onclick=()=>{ if(!usable) return;
      if(p.key==='curse') showTargets(); else use(p.key,null); };
    g.appendChild(b);
  });
}
function showTargets(){
  const tp=$('targetPick'); tp.innerHTML=''; tp.classList.remove('hidden');
  if(!myOthers.length){ tp.innerHTML='<div class="sub">No rivals to curse.</div>'; return; }
  const lbl=document.createElement('div'); lbl.className='sub'; lbl.textContent='Curse who?'; tp.appendChild(lbl);
  myOthers.forEach(o=>{ const b=document.createElement('div'); b.className='tgt';
    b.innerHTML=avatarSVG(o.hero,28)+'<span>'+o.name+'</span>';
    b.onclick=()=>use('curse',o.id); tp.appendChild(b); });
}
function use(potion,targetId){ socket.emit('usePotion',{pin:PIN,potion,targetId}); }
socket.on('potionUsed', d=>{
  if(Array.isArray(d.inventory)) INVENTORY=d.inventory;   // the used potion is now gone
  usedThisRound=true;
  $('targetPick').classList.add('hidden');
  const an=$('armedNote'); an.classList.remove('hidden');
  const meta=POTIONS.find(p=>p.key===d.armed);
  an.textContent='Used: '+(meta?meta.icon+' '+meta.name:d.armed)+(d.targetName?(' → '+d.targetName):'')+'!';
  renderShop();
});

socket.on('gameOver', d=>{
  if(prepTimer){ clearTimeout(prepTimer); prepTimer=null; }
  stopTimer(); phase='over'; show('gover');
  const st=d.standings||[]; const rank=st.findIndex(p=>p.id===MYID)+1;
  $('goHero').innerHTML=d.winner?avatarSVG(d.winner.hero,64):'🏁';
  const win=d.winner?('★ '+d.winner.name+' WINS! ★'):'GAME OVER';
  const place=rank>0?('<div style="font-family:VT323,monospace;font-size:26px;color:#fff;margin-top:6px;">You finished #'+rank+' of '+st.length+'</div>'):'';
  $('goText').innerHTML=win+place; });
socket.on('gameReset', d=>{
  if(prepTimer){ clearTimeout(prepTimer); prepTimer=null; }
  INVENTORY=d.inventory||[]; usedThisRound=false; myChoice=null; lastOptions=null; stopTimer(); phase='lobby';
  if(typeof setMapSpecials==='function') setMapSpecials(d.specials||[]);
  if(MYHERO){ $('waitHero').innerHTML=avatarSVG(MYHERO,64); show('wait'); }
  else show('pick');
});
socket.on('hostLeft', ()=>{ show('join'); $('err').textContent='Host ended the game.'; });

function startTimer(ms){ stopTimer(); const end=Date.now()+ms;
  const tick=()=>{ const s=Math.max(0,Math.ceil((end-Date.now())/1000)); $('timeLeft').textContent=s+'s';
    if(s<=0){ stopTimer(); lockAnswers(); } };
  tick(); timerInt=setInterval(tick,250); }
function stopTimer(){ if(timerInt){clearInterval(timerInt); timerInt=null;} }
function lockAnswers(){ // time ran out (e.g. half-time block) — disable answering
  if(myChoice!=null) return;
  document.querySelectorAll('#answers .ans').forEach(b=>{ b.disabled=true; b.style.opacity=.4; });
  $('timeLeft').textContent="Time's up!";
}
</script>
</body>
</html>
